[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stateguard"
version = "0.1.0"
description = "Analytical state management and error repair for long-horizon data agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "StateGuard Authors"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stateguard = ["prompts/*.txt"]

[tool.ruff]
line-length = 100
target-version = "py310"
