[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stateguard"
version = "0.1.0"
description = "Analytical state management and error repair for long-horizon data agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "StateGuard Authors"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
dabstep = ["datasets==3.2.0", "huggingface-hub==0.27.1", "smolagents==1.3.0", "litellm==1.58.2", "tenacity==9.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stateguard = ["prompts/*.txt"]
"stateguard.adapters.dacomp" = ["*.txt"]
"stateguard.adapters.dabstep" = ["*.txt"]
"stateguard.adapters.longds" = ["*.txt"]

[tool.ruff]
line-length = 100
target-version = "py310"
